      src.start(t0);
      src.stop(t0 + duration + 0.02);
    }

  // 横屏用 960x420；竖屏用固定高度 1000 的世界，宽度随屏幕比例，角色更大。
  function fit() {
    const rect = stage.getBoundingClientRect();
    const style = window.getComputedStyle(stage);
    const availW = Math.max(1, rect.width - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
    const availH = Math.max(1, rect.height - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
    const aspect = availW / availH;
    const portrait = aspect < 1.0;

    if (portrait !== lastPortrait) {
      lastPortrait = portrait;
      const oldGround = GROUND_Y;

      if (portrait) {
        W = Math.max(420, Math.min(780, Math.round(1000 * aspect)));
        H = 1000;
        GROUND_Y = 790;
        speedCap = 600;
        pig.x = 100;
      } else {
        W = 960;
        H = 420;
        GROUND_Y = 332;
        speedCap = MAX_SPEED;
        pig.x = 150;
      }

      const dy = GROUND_Y - oldGround;
      if (dy !== 0) {
        pig.y += dy;
        for (const c of state.coins) c.y += dy;
        for (const p of state.pops) p.y += dy;
      }

      resetClouds();
      if (state.mode === 'running') state.mode = 'paused';
    }

    const scale = Math.min(availW / W, availH / H);
    const cssW = Math.max(1, Math.round(W * scale));
    const cssH = Math.max(1, Math.round(H * scale));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => window.setTimeout(fit, 250));

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

    distance: 0,
    speed: START_SPEED,
    score: 0,
    best: 0,
    spawnIn: 1.2,

    clouds: [],
    coins: [],
    pops: [],
    runTime: 0,
    lastCoinAt: 0,
    coinFree: 0,
    coinNeed: 280,
    shake: 0

  const pig = {

    buffer: 0
  };

  const input = { held: false };

  try {
    state.best = Number(localStorage.getItem('pigjump.best')) || 0;
  } catch (err) {
    state.best = 0;
  }

  function resetClouds() {
    state.clouds.length = 0;
    const skyTop = 40;
    const skyBottom = Math.max(200, H * 0.38);
    for (let i = 0; i < 8; i += 1) {
      state.clouds.push({
        x: Math.random() * W,
        y: skyTop + Math.random() * (skyBottom - skyTop),
        s: 0.6 + Math.random() * 0.9,
        sp: 0.05 + Math.random() * 0.08
      });
    }
  }

  fit();

  function press() {
    if (state.mode === 'over') return;
    Sound.unlock();
    input.held = true;
    if (state.mode === 'ready') {
      state.mode = 'running';
      pig.buffer = 0.12;
    } else if (state.mode === 'paused') {
      state.mode = 'running';
      last = performance.now();
      acc = 0;
    } else {
      pig.buffer = 0.12;
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (e.repeat) return;
      press();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      input.held = false;
    }
  });

  let activePointer = null;

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (activePointer !== null) return;
    activePointer = e.pointerId;
    press();
  });

  function endPointer(e) {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    input.held = false;
  }

  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  window.addEventListener('blur', () => {
    activePointer = null;
    input.held = false;
  });

  // 手机上屏蔽长按菜单、橡皮筋滚动和双指缩放。
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    // 结算卡片内部允许上下滚动，其余区域仍然禁止页面滚动。
    if (e.target && e.target.closest && e.target.closest('.over-card')) return;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  function reset() {
    state.distance = 0;
    state.speed = START_SPEED;
    state.score = 0;
    state.spawnIn = 1.1;
    state.shake = 0;
    state.runTime = 0;
    state.lastCoinAt = 0;
    state.coinFree = 0;
    state.coinNeed = randomCoinGap();
    state.obstacles.length = 0;
    state.coins.length = 0;
    state.pops.length = 0;
    pig.y = GROUND_Y;
    pig.vy = 0;
    pig.onGround = true;
    pig.squash = 1;
    pig.phase = 0;
    pig.buffer = 0;
  }

  function die() {
    state.mode = 'over';
    state.shake = 0.6;
    pig.squash = 0.82;
    Sound.hit();
    if (state.score > state.best) {
      state.best = state.score;
      try {
        localStorage.setItem('pigjump.best', String(state.best));
      } catch (err) {
        /* 隐私模式下忽略 */
      }
    }
    showOver();
  }

  function spawn() {
    const d = Math.min(1, state.distance / 4500);
    const pool = ['hay', 'crate'];
    if (d > 0.25) pool.push('fence');
    if (d > 0.45) pool.push('hay2', 'hay');
    if (d > 0.7) pool.push('fence2');
    const type = pool[(Math.random() * pool.length) | 0];
    const dims = {
      hay: [38, 44],
      hay2: [66, 44],
      fence: [32, 60],
      fence2: [70, 60],
      crate: [44, 44]
    };
    const size = dims[type];
    // 障碍物周围是金币禁区：如果旁边有金币，这帧先不生成，下一帧再试
    if (coinNearSpawn(W + 60, size[0])) return;
    state.obstacles.push({ x: W + 60, w: size[0], h: size[1], type: type });
    state.spawnIn = (1.05 + Math.random() * 0.5) * (1 - 0.15 * d);
  }

  function stepPig(dt) {
    pig.buffer = Math.max(0, pig.buffer - dt);
    pig.squash += (1 - pig.squash) * Math.min(1, dt * 10);

    if (pig.buffer > 0 && pig.onGround) {
      pig.vy = JUMP_V;
      pig.onGround = false;
      pig.buffer = 0;
      pig.squash = 0.86;
      Sound.jump();
    }

    if (!pig.onGround) {
      const g = (input.held && pig.vy < 0) ? GRAVITY * 0.55 : GRAVITY;
      pig.vy = Math.min(pig.vy + g * dt, 1800);
      pig.y += pig.vy * dt;
      if (pig.y >= GROUND_Y) {
        pig.y = GROUND_Y;
        pig.vy = 0;
        pig.onGround = true;
        pig.squash = 1.18;
        Sound.land();
      }
// 空中腿脚保持一个固定姿态，落地后重新跑动
      pig.phase += dt * 8;
    } else {
      pig.phase += dt * (state.speed / 55);
    }
  }

  function collide() {
    const pl = pig.x - 20;
    const pr = pig.x + 20;
    const pt = pig.y - 42;
    const pb = pig.y - 2;

    for (const o of state.obstacles) {
      const ol = o.x + 4;
      const or = o.x + o.w - 4;
      const ot = GROUND_Y - o.h + 3;
      const ob = GROUND_Y;
      if (pl < or && pr > ol && pt < ob && pb > ot) {
        die();
        return;
      }
    }
  }

  // 障碍物左右各 COIN_KEEPOUT 的范围是金币生成禁区
  function coinBlocked(x) {
    for (const o of state.obstacles) {
      if (x > o.x - COIN_KEEPOUT && x < o.x + o.w + COIN_KEEPOUT) return true;
    }
    return false;
  }

  // 生成障碍物前检查：它的禁区里不能已经有金币
  function coinNearSpawn(x, w) {
    for (const c of state.coins) {
      if (c.x + c.r > x - COIN_KEEPOUT && c.x - c.r < x + w + COIN_KEEPOUT) return true;
    }
    return false;
  }

  function randomCoinGap() {
    return COIN_GAP_MIN + Math.random() * (COIN_GAP_MAX - COIN_GAP_MIN);
  }

  function spawnCoin() {
    const height = 34 + Math.random() * 126; // 离地 34~160，都是跳得到的范围
    state.coins.push({ x: W + 50, y: GROUND_Y - height, r: COIN_RADIUS });
  }

  function updateCoins(dt) {
    for (const c of state.coins) c.x -= state.speed * dt;
    if (state.coins.length && state.coins[0].x < -60) state.coins.shift();

    // 生成点（含金币自身半径）落在禁区里时，这段滚动距离不计入金币间隔
    if (coinBlocked(W + 50 - COIN_RADIUS)) return;

    state.coinFree += state.speed * dt;
    if (state.coinFree < state.coinNeed) return;
    if (state.coins.length >= COIN_MAX) return;

    spawnCoin();
    state.coinFree = 0;
    state.coinNeed = randomCoinGap();
  }

  function collectCoins() {
    const pl = pig.x - 26;
    const pr = pig.x + 26;
    const pt = pig.y - 52;
    const pb = pig.y - 2;

    for (let i = state.coins.length - 1; i >= 0; i -= 1) {
      const c = state.coins[i];
      const nx = Math.max(pl, Math.min(c.x, pr));
      const ny = Math.max(pt, Math.min(c.y, pb));
      const dx = c.x - nx;
      const dy = c.y - ny;
      if (dx * dx + dy * dy > c.r * c.r) continue;

      state.coins.splice(i, 1);
      const gain = coinValue();
      state.score += gain;
      state.lastCoinAt = state.runTime;
      state.pops.push({ x: c.x, y: c.y - 8, text: '+' + gain, life: 0.9 });
      Sound.coin();
    }
  }

  function coinValue() {
    // 每枚金币 = 1 + 存活时长系数 + 距上一枚金币的间隔系数（没有被动加分）
    const survival = Math.floor(state.runTime * COIN_SURVIVAL_RATE);
    const gap = Math.min(30, Math.floor((state.runTime - state.lastCoinAt) * COIN_GAP_RATE));
    return 1 + survival + gap;
  }

  function update(dt) {
    if (state.mode === 'paused') return;
    state.time += dt;

    const cloudSpeed = state.mode === 'running' ? state.speed : 60;
    for (const c of state.clouds) {
      c.x -= cloudSpeed * c.sp * dt;
      if (c.x < -160) {
        c.x = W + 160;
        c.y = 40 + Math.random() * 150;
      }
    }

    if (state.mode === 'running') {
      state.speed = Math.min(speedCap, START_SPEED + state.distance * 0.018);
      state.distance += state.speed * dt;
      state.runTime += dt;

      state.spawnIn -= dt;
      if (state.spawnIn <= 0) spawn();

      for (const o of state.obstacles) o.x -= state.speed * dt;
      if (state.obstacles.length && state.obstacles[0].x < -90) {
        state.obstacles.shift();
      }

      updateCoins(dt);
      stepPig(dt);
      collide();
      if (state.mode === 'running') collectCoins();

      for (const p of state.pops) p.life -= dt;
      state.pops = state.pops.filter((p) => p.life > 0);
    } else {
      pig.phase += dt * 3;
      pig.squash += (1 - pig.squash) * Math.min(1, dt * 8);
    }

    if (state.shake > 0) {
      state.shake = Math.max(0, state.shake - dt * 1.6);
    }
  }

  function drawCloud(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.arc(28, -8, 26, 0, Math.PI * 2);
    ctx.arc(58, 2, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, '#ffe1ee');
    g.addColorStop(0.45, '#ffeef3');
    g.addColorStop(1, '#fff7e9');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND_Y);

    ctx.fillStyle = 'rgba(255, 214, 165, 0.45)';
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.22, 54, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 240, 205, 0.95)';
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.22, 34, 0, Math.PI * 2);
    ctx.fill();

    for (const c of state.clouds) drawCloud(c);
  }

  function hillLayer(parallax, color, baseY, amp, freq) {
    const off = (state.distance * parallax) % 2000;
    ctx.beginPath();
    ctx.moveTo(-20, GROUND_Y + 4);
    for (let x = -20; x <= W + 20; x += 16) {
      const y = baseY - Math.sin((x + off) * freq) * amp - Math.cos((x + off) * freq * 1.7) * amp * 0.35;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 20, GROUND_Y + 4);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawHills() {
    hillLayer(0.18, '#f3c9d6', GROUND_Y - 56, 46, 0.0065);
    hillLayer(0.4, '#e5aebf', GROUND_Y - 26, 34, 0.009);
  }

  function drawGround() {
    ctx.fillStyle = '#ecd2ad';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    ctx.fillStyle = '#a8cf8a';
    ctx.fillRect(0, GROUND_Y, W, 12);

    ctx.fillStyle = 'rgba(120, 160, 90, 0.55)';
    ctx.fillRect(0, GROUND_Y + 12, W, 3);

    const off = state.distance % 64;
    ctx.fillStyle = 'rgba(180, 140, 96, 0.4)';
    for (let x = -64; x < W + 64; x += 64) {
      ctx.fillRect(x - off, GROUND_Y + 34, 30, 4);
      ctx.fillRect(x - off + 36, GROUND_Y + 60, 18, 3);
    }
  }

  function drawShadow() {
    const air = Math.max(0, GROUND_Y - pig.y);
    const k = Math.max(0.45, 1 - air / 300);
    ctx.fillStyle = 'rgba(120, 80, 100, ' + (0.14 * k).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(pig.x, GROUND_Y + 6, 32 * k, 7 * k, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawObstacle(o) {
    const x = o.x;
    const y = GROUND_Y - o.h;
    const w = o.w;
    const h = o.h;

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 2;

    if (o.type === 'hay' || o.type === 'hay2') {
      ctx.fillStyle = '#ecc46b';
      ctx.strokeStyle = '#b98a3f';
      roundRect(x, y, w, h, 8);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = 'rgba(150, 110, 50, 0.6)';
      ctx.beginPath();
      ctx.moveTo(x + 5, y + h * 0.36);
      ctx.lineTo(x + w - 5, y + h * 0.36);
      ctx.moveTo(x + 5, y + h * 0.7);
      ctx.lineTo(x + w - 5, y + h * 0.7);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 240, 190, 0.55)';
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 8);
      ctx.lineTo(x + w - 10, y + h - 8);
      ctx.stroke();
    } else if (o.type === 'fence' || o.type === 'fence2') {
      ctx.fillStyle = '#b98455';
      ctx.strokeStyle = '#8a5c37';
      ctx.fillRect(x + 2, y, 7, h);
      ctx.strokeRect(x + 2, y, 7, h);
      ctx.fillRect(x + w - 9, y, 7, h);
      ctx.strokeRect(x + w - 9, y, 7, h);

      ctx.fillStyle = '#c99a68';
      for (const ry of [0.24, 0.58]) {
        ctx.fillRect(x, y + h * ry, w, 9);
        ctx.strokeRect(x, y + h * ry, w, 9);
      }
    } else {
      ctx.fillStyle = '#d8a870';
      ctx.strokeStyle = '#9c6a3c';
      roundRect(x, y, w, h, 5);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 5, y + 5);
      ctx.lineTo(x + w - 5, y + h - 5);
      ctx.moveTo(x + w - 5, y + 5);
      ctx.lineTo(x + 5, y + h - 5);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawCoins() {
    for (const c of state.coins) {
      const glow = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, c.r + 12);
      glow.addColorStop(0, 'rgba(255, 226, 150, 0.85)');
      glow.addColorStop(1, 'rgba(255, 226, 150, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r + 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '38px ' + EMOJI_FONT;
      ctx.fillText('🎂', c.x, c.y + 1);
      ctx.restore();
    }
  }

  function drawPops() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 18px ' + FONT_UI;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255, 248, 232, 0.92)';
    for (const p of state.pops) {
      const t = Math.max(0, p.life / 0.9);
      const y = p.y - (1 - t) * 26;
      ctx.globalAlpha = t;
      ctx.strokeText(p.text, p.x, y);
      ctx.fillStyle = '#7a4530';
      ctx.fillText(p.text, p.x, y);
    }
    ctx.restore();
  }

  function drawPig() {
    const size = 66;
    ctx.save();
    ctx.translate(pig.x, pig.y);
    ctx.scale(-1, 1);
    if (pigSpriteReady) {
      ctx.shadowColor = 'rgba(96, 54, 74, 0.32)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 5;
      ctx.drawImage(pigSprite, -size / 2, -size, size, size);
    } else {
      ctx.font = '58px ' + EMOJI_FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('🐖', 0, 0);
    }
    ctx.restore();
  }

  function drawHud() {
    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = '600 26px ' + FONT_MONO;
    ctx.fillStyle = 'rgba(94, 60, 78, 0.85)';
    ctx.fillText(String(state.score).padStart(4, '0'), W - 30, 54);

    ctx.font = '600 13px ' + FONT_MONO;
    ctx.fillStyle = 'rgba(94, 60, 78, 0.5)';
    ctx.fillText('最高 ' + String(state.best).padStart(4, '0'), W - 30, 78);
    ctx.restore();
  }

  function drawOverlay() {
    if (state.mode === 'running' || state.mode === 'over') return;

    const blink = 0.55 + 0.45 * Math.sin(state.time * 4);
    const cx = W / 2;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (state.mode === 'ready') {
      const cy = GROUND_Y - 110;
      ctx.fillStyle = 'rgba(94, 60, 78, ' + blink.toFixed(3) + ')';
      ctx.font = '700 30px ' + FONT_UI;
      ctx.fillText(isTouch ? '点按屏幕开始' : '按 空格 / 点击 开始', cx, cy);
    } else if (state.mode === 'paused') {
      const cy = GROUND_Y - 120;
      ctx.fillStyle = 'rgba(60, 40, 52, 0.3)';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
      roundRect(cx - 170, cy - 65, 340, 130, 24);
      ctx.fill();

      ctx.fillStyle = '#5e3c4e';
      ctx.font = '700 30px ' + FONT_UI;
      ctx.fillText('已暂停', cx, cy - 17);

      ctx.font = '600 16px ' + FONT_UI;
      ctx.fillStyle = 'rgba(94, 60, 78, 0.65)';
      ctx.fillText(isTouch ? '点按屏幕继续' : '按 空格 继续', cx, cy + 27);
    }

    ctx.restore();
  }

  function render() {
    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * 14 * state.shake, (Math.random() - 0.5) * 10 * state.shake);
    }

    drawSky();
    drawHills();
    drawGround();
    drawShadow();
    for (const o of state.obstacles) drawObstacle(o);
    drawCoins();
    drawPig();
    drawPops();
    drawHud();

    ctx.restore();
    drawOverlay();
  }

  const overLayer = document.getElementById('overLayer');
  const overCard = document.getElementById('overCard');
  const overImage = document.getElementById('overImage');
  const overFallback = document.getElementById('overFallback');
  const overScore = document.getElementById('overScore');
  const overBest = document.getElementById('overBest');
  const retryButton = document.getElementById('retryButton');
  const shareButton = document.getElementById('shareButton');

  let pigPool = PIG_POOL.slice();
  let lastPigIndex = -1;
  let sharing = false;

  function showOver() {
    overScore.textContent = String(state.score);
    overBest.textContent = String(state.best);
    overCard.scrollTop = 0;
    overLayer.hidden = false;
    showRandomPig();
  }

  function showRandomPig() {
    if (pigPool.length === 0) {
      overImage.hidden = true;
      overFallback.hidden = false;
      return;
    }
    let index = Math.floor(Math.random() * pigPool.length);
    if (pigPool.length > 1 && index === lastPigIndex) index = (index + 1) % pigPool.length;
    lastPigIndex = index;

    overImage.hidden = false;
    overFallback.hidden = true;
    overImage.src = 'https://pighub.top' + encodeURI(pigPool[index]);
  }

  function restartGame() {
    overLayer.hidden = true;
    overImage.removeAttribute('src');
    reset();
    state.mode = 'running';
    last = performance.now();
    acc = 0;
  }

  function buildShareCanvas() {
    const shareCanvas = document.createElement('canvas');
    const imgW = 960;
    const imgH = Math.max(320, Math.round(imgW * canvas.height / canvas.width));
    const footerH = 300;
    shareCanvas.width = imgW;
    shareCanvas.height = imgH + footerH;
    const g = shareCanvas.getContext('2d');

    const bg = g.createLinearGradient(0, 0, 0, shareCanvas.height);
    bg.addColorStop(0, '#191420');
    bg.addColorStop(1, '#2b2030');
    g.fillStyle = bg;
    g.fillRect(0, 0, imgW, shareCanvas.height);

    g.drawImage(canvas, 0, 0, imgW, imgH);

    g.textAlign = 'center';
    g.fillStyle = '#ffe3ee';
    g.font = '800 40px ' + FONT_UI;
    g.fillText('猪跑酷', 480, imgH + 76);

    g.fillStyle = '#ff7fa8';
    g.font = '800 64px ' + FONT_MONO;
    g.fillText(String(state.score), 480, imgH + 166);

    g.fillStyle = 'rgba(255, 227, 238, 0.72)';
    g.font = '600 22px ' + FONT_UI;
    g.fillText('本次得分 · 最高 ' + state.best + ' 分', 480, imgH + 212);

    g.fillStyle = 'rgba(255, 227, 238, 0.4)';
    g.font = '500 18px ' + FONT_UI;
    g.fillText('猪跑酷', 480, imgH + 268);

    return shareCanvas;
  }

  async function shareResult() {
    if (sharing) return;
    sharing = true;
    shareButton.disabled = true;
    shareButton.textContent = '生成中…';
    try {
      const shareCanvas = buildShareCanvas();
      const blob = await new Promise((resolve) => shareCanvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('生成失败');
      const file = new File([blob], 'pig-jump-' + state.score + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: '猪跑酷', text: '我在猪跑酷里拿了 ' + state.score + ' 分！' });
      } else {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'pig-jump-' + state.score + '.png';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 3000);
      }
    } catch (err) {
      /* 用户取消分享或浏览器不支持文件分享 */
    } finally {
      shareButton.disabled = false;
      shareButton.textContent = '分享截图';
      sharing = false;
    }
  }

  retryButton.addEventListener('click', restartGame);
  shareButton.addEventListener('click', shareResult);
  overImage.addEventListener('error', () => {
    overImage.hidden = true;
    overFallback.hidden = false;
  });

  let last = performance.now();
  let acc = 0;

  const fsButton = document.getElementById('fs');
  if (typeof document.documentElement.requestFullscreen !== 'function') {
    fsButton.hidden = true;
  }
  fsButton.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement === null) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (err) {
      /* 用户取消或浏览器拒绝时静默 */
    }
    fsButton.blur();
  });

  const soundButton = document.getElementById('sound');
  soundButton.addEventListener('click', () => {
    const muted = Sound.toggleMute();
    soundButton.textContent = muted ? '🔇' : '🔊';
    soundButton.setAttribute('aria-label', muted ? '开启声音' : '关闭声音');
    soundButton.blur();
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state.mode === 'running') state.mode = 'paused';
    } else {
      last = performance.now();
      acc = 0;
    }
  });

  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.2) dt = 0.2;

    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 24) {
      update(STEP);
      acc -= STEP;
      guard++;
    }
    render();
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
